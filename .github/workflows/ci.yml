name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Lint, type check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Also runs the `prepare` script, which patches the local TypeScript and
      # oxlint installs with @effect/tsgo so both emit Effect diagnostics.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint + Effect language service rules)
        run: bun run lint --format=github

      - name: Type check
        run: bun run typecheck

      - name: Run tests with coverage
        run: bun run test:coverage

  build:
    name: Build library
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  compile:
    name: Compile Tasker JS
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile tasks to JavaScript
        run: bun run compile

      - name: Upload compiled Tasker JS
        uses: actions/upload-artifact@v4
        with:
          name: tasker-js
          path: dist-tasker/
          retention-days: 30

  bundle-analyzer:
    name: Bundle size report
    runs-on: ubuntu-latest
    needs: compile
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled Tasker JS (PR head, already built by `compile`)
        uses: actions/download-artifact@v4
        with:
          name: tasker-js
          path: head-dist-tasker/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install base dependencies
        working-directory: base
        run: bun install --frozen-lockfile

      - name: Compile base Tasker JS
        working-directory: base
        run: bun run compile

      - name: Generate bundle size report
        run: node scripts/bundle-size-report.mjs base/dist-tasker head-dist-tasker bundle-report.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("bundle-report.md", "utf8");
            const marker = "<!-- bundle-analyzer-report -->";

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  release:
    name: Publish releases
    runs-on: ubuntu-latest
    needs: [build, compile]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled Tasker JS
        uses: actions/download-artifact@v4
        with:
          name: tasker-js
          path: dist-tasker/

      # Immutable per-push snapshot, so a bad build can be undone via the
      # Rollback workflow. --latest=false keeps /releases/latest — the
      # endpoint devices sync from — pointing at the rolling release.
      - name: Publish versioned snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="tasker-js-v${{ github.run_number }}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --latest=false \
              --title "Tasker JS v${{ github.run_number }} ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
              --notes "Snapshot of \`dist-tasker/\` at ${{ github.sha }}. Restore it with the Rollback workflow (Actions → Rollback rolling release)."
          fi
          gh release upload "$TAG" dist-tasker/* --clobber

      # Devices pull from the latest release (see src/sync/core.ts), so keep a
      # rolling release whose assets always match the newest green commit.
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-rolling-release.sh dist-tasker
