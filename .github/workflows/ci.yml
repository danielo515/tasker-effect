name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  compile-profiles:
    name: Compile Profiles
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Compile profiles
        run: |
          mkdir -p compiled-profiles
          # Run the profile compiler script if it exists
          if [ -f "scripts/compile-profiles.ts" ]; then
            bun run scripts/compile-profiles.ts
          else
            echo "No profile compiler script found. Creating example..."
            cat > compiled-profiles/README.md << 'EOF'
          # Compiled Tasker Profiles

          This directory contains compiled Tasker profiles from the tasker-effect project.

          ## Usage

          1. Download the XML files to your Android device
          2. Import them into Tasker:
             - For tasks: Long press TASKS tab → Import Task
             - For profiles: Long press PROFILES tab → Import Profile
             - For projects: Long press project bar → Import Project

          ## Files

          Files are named according to their type:
          - `*.tsk.xml` - Task files
          - `*.prf.xml` - Profile files
          - `*.prj.xml` - Project files
          EOF
          fi

      - name: Upload compiled profiles
        uses: actions/upload-artifact@v4
        with:
          name: tasker-profiles
          path: compiled-profiles/
          retention-days: 30

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, compile-profiles]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download compiled profiles
        uses: actions/download-artifact@v4
        with:
          name: tasker-profiles
          path: compiled-profiles/

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create release zip
        run: |
          zip -r tasker-profiles-${{ steps.version.outputs.version }}.zip compiled-profiles/

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view v${{ steps.version.outputs.version }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          gh release create v${{ steps.version.outputs.version }} \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Automated release of tasker-effect v${{ steps.version.outputs.version }}" \
            tasker-profiles-${{ steps.version.outputs.version }}.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
