name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Type check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

  build:
    name: Build library
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  compile:
    name: Compile Tasker JS
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile tasks to JavaScript
        run: bun run compile

      - name: Upload compiled Tasker JS
        uses: actions/upload-artifact@v4
        with:
          name: tasker-js
          path: dist-tasker/
          retention-days: 30

  release:
    name: Publish rolling release
    runs-on: ubuntu-latest
    needs: [build, compile]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled Tasker JS
        uses: actions/download-artifact@v4
        with:
          name: tasker-js
          path: dist-tasker/

      # Devices pull from the latest release (see src/sync.ts), so keep a
      # rolling release whose assets always match the newest green commit.
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=tasker-js-latest
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Latest compiled Tasker JS" \
              --notes "Rolling release updated by CI on every push. Devices sync from these assets."
          fi
          gh release upload "$TAG" dist-tasker/* --clobber
